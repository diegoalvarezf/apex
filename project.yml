name: Forma
options:
  bundleIdPrefix: com.diegoalvarezfrancos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - path: Sources/Forma
    resources:
      - path: Sources/Forma/Resources
    info:
      path: Sources/Forma/App/Info.plist
      properties:
        CFBundleName: Forma
        CFBundleDisplayName: Forma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Forma uses Health data to calculate your recovery score, analyze sleep quality and track fitness trends."
        NSHealthUpdateUsageDescription: "Forma may write workout summaries to Apple Health."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - forma-strava
            CFBundleURLName: com.diegoalvarezfrancos.forma.strava
    entitlements:
      path: Sources/Forma/App/Forma.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.forma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
