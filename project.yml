name: Apex
schemes:
  Apex:
    build:
      targets:
        Apex: all
        ApexWidget: [Build]
        ApexWatch: [Build]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ApexTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ApexWatch:
    build:
      targets:
        ApexWatch: all
    run:
      config: Debug
    archive:
      config: Release
options:
  bundleIdPrefix: com.diegoalvarezfrancos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # La interfaz está escrita en español: declararlo hace que las fechas, los números
  # y los formatos del sistema salgan en español y no en inglés.
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Apex:
    type: application
    platform: iOS
    sources:
      - path: Sources/Apex
      - path: Sources/Shared
    resources:
      - path: Sources/Apex/Resources
    info:
      path: Sources/Apex/App/Info.plist
      properties:
        CFBundleName: Apex
        CFBundleDisplayName: Apex
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Apex uses Health data to calculate your recovery score, analyze sleep quality and track fitness trends."
        NSHealthUpdateUsageDescription: "Apex may write workout summaries to Apple Health."
        NSLocationWhenInUseUsageDescription: "Apex uses your location to track your route during outdoor activities like running, cycling or hiking."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - apex-strava
            CFBundleURLName: com.diegoalvarezfrancos.apex.strava
        LSApplicationQueriesSchemes:
          - strava
    dependencies:
      - target: ApexWidget
        embed: true
      - target: ApexWatch
        embed: true
    entitlements:
      path: Sources/Apex/App/Apex.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.security.application-groups:
          - group.com.diegoalvarezfrancos.apex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.apex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent

  ApexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ApexTests
    dependencies:
      - target: Apex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.apex.tests
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true

  ApexWidget:
    type: app-extension
    platform: iOS
    extensionType: widgetkit-extension
    sources:
      - path: Sources/ApexWidget
    info:
      path: Sources/ApexWidget/Info.plist
      properties:
        CFBundleDisplayName: ApexWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/ApexWidget/ApexWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.diegoalvarezfrancos.apex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.apex.widget
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  ApexWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ApexWatch
      - path: Sources/Shared
    info:
      path: Sources/ApexWatch/Info.plist
      properties:
        CFBundleDisplayName: Apex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.diegoalvarezfrancos.apex
    # Sin entitlements: el reloj no lee HealthKit ni el grupo compartido, recibe
    # todo del iPhone por WatchConnectivity. Declararlos obligaba a provisionarlos
    # —y HealthKit y App Groups exigen cuenta de desarrollador de pago—, lo que hacía
    # fallar la instalación en un reloj real con "could not be installed at this time".
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.apex.watchkitapp
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
